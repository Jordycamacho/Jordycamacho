<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Jordy Camacho — Backend Java / Spring Boot</title>
  <desc id="desc">Desarrollador backend en Madrid. APIs, microservicios, ecosistema JNOB y homelab Proxmox.</desc>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="48%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#78703F"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78703F" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="65%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#78703F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="86%" cy="0%" r="48%">
      <stop offset="0%" stop-color="#78703F" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#B8860B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="6%" cy="100%" r="42%">
      <stop offset="0%" stop-color="#B8860B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1100" height="360" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1100" height="360" fill="#121212"/>
    <rect width="1100" height="360" fill="url(#glowR)"/>
    <rect width="1100" height="360" fill="url(#glowL)"/>

    <!-- subtle grid -->
    <g stroke="#333333" stroke-opacity="0.35" stroke-width="1">
      <path d="M0 72h1100"/>
      <path d="M0 288h1100"/>
    </g>

    <!-- top meta -->
    <circle cx="42" cy="36" r="4.5" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="41" fill="#FFD700" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">DISPONIBLE PARA PROYECTOS</text>
    <text x="1058" y="41" fill="#B3B3B3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" text-anchor="end" letter-spacing="1.4">MADRID, ESPAÑA</text>

    <!-- name -->
    <text x="550" y="150" fill="url(#gold)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="800" text-anchor="middle" letter-spacing="10">JORDY CAMACHO</text>

    <rect x="330" y="172" width="440" height="2" rx="1" fill="url(#line)"/>
    <rect x="330" y="171" width="90" height="4" rx="2" fill="url(#shimmer)">
      <animate attributeName="x" values="330;710;330" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <text x="550" y="214" fill="#FFFFFF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0.4">Backend Java / Spring Boot</text>
    <text x="550" y="244" fill="#B3B3B3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="middle">APIs · microservicios · ecosistema JNOB · homelab Proxmox 24/7</text>

    <!-- stack chips -->
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.6">
      <rect x="198" y="304" width="72" height="28" rx="14" fill="#1E1E1E" stroke="#78703F" stroke-opacity="0.55"/>
      <text x="234" y="323" fill="#FFD700" text-anchor="middle">Java</text>
      <rect x="278" y="304" width="118" height="28" rx="14" fill="#1E1E1E" stroke="#78703F" stroke-opacity="0.55"/>
      <text x="337" y="323" fill="#FFD700" text-anchor="middle">Spring Boot</text>
      <rect x="404" y="304" width="102" height="28" rx="14" fill="#1E1E1E" stroke="#78703F" stroke-opacity="0.55"/>
      <text x="455" y="323" fill="#FFD700" text-anchor="middle">PostgreSQL</text>
      <rect x="514" y="304" width="80" height="28" rx="14" fill="#1E1E1E" stroke="#78703F" stroke-opacity="0.55"/>
      <text x="554" y="323" fill="#FFD700" text-anchor="middle">Docker</text>
      <rect x="602" y="304" width="78" height="28" rx="14" fill="#1E1E1E" stroke="#78703F" stroke-opacity="0.55"/>
      <text x="641" y="323" fill="#FFD700" text-anchor="middle">Kotlin</text>
      <rect x="688" y="304" width="72" height="28" rx="14" fill="#1E1E1E" stroke="#78703F" stroke-opacity="0.55"/>
      <text x="724" y="323" fill="#FFD700" text-anchor="middle">React</text>
      <rect x="768" y="304" width="88" height="28" rx="14" fill="#1E1E1E" stroke="#78703F" stroke-opacity="0.55"/>
      <text x="812" y="323" fill="#FFD700" text-anchor="middle">Proxmox</text>
    </g>
  </g>

  <rect x="1" y="1" width="1098" height="358" rx="21" fill="none" stroke="#78703F" stroke-opacity="0.5"/>
</svg>
