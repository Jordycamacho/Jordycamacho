<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="88" viewBox="0 0 1100 88" role="img" aria-label="Pie de perfil">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#78703F"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78703F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#78703F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1100" height="88" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1100" height="88" fill="#121212"/>
    <line x1="80" y1="1" x2="1020" y2="1" stroke="url(#line)" stroke-width="2"/>
    <text x="550" y="40" fill="#FFFFFF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Arquitectura clara. Seguridad real. Sistemas que siguen en marcha.</text>
    <text x="550" y="64" fill="url(#gold)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="1.2">MISMA TEMÁTICA DORADA QUE JORDYCAMACHO.DEV</text>
  </g>
  <rect x="1" y="1" width="1098" height="86" rx="17" fill="none" stroke="#78703F" stroke-opacity="0.4"/>
